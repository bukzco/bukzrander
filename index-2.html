<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bukz Planta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --ch:#2A2A2C; --ch2:#323235; --ch3:#3B3B3F; --in:#1F1F21; --bd:#161618; --bd2:#454549;
  --tx:#E2E2E4; --mu:#9B9BA1; --ac:#2F6BDE; --ac2:#4A82F0; --yel:#F5E100; --ink:#272622;
  --danger:#E5534B; --ok:#3FB950;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --disp:"Bebas Neue", Impact, "Arial Narrow", sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --ch:#E9E9EB; --ch2:#DCDCDF; --ch3:#FFFFFF; --in:#FFFFFF; --bd:#B9B9BE; --bd2:#C9C9CE; --tx:#1D1D1F; --mu:#6B6B70; color-scheme:light; }
}
:root[data-theme="light"]{ --ch:#E9E9EB; --ch2:#DCDCDF; --ch3:#FFFFFF; --in:#FFFFFF; --bd:#B9B9BE; --bd2:#C9C9CE; --tx:#1D1D1F; --mu:#6B6B70; color-scheme:light; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--ch); color:var(--tx); font:13px/1.35 var(--ui); overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
input,select,button{ font:inherit; color:inherit; }
input,select{ user-select:text; -webkit-user-select:text; }
:focus-visible{ outline:2px solid var(--ac2); outline-offset:1px; }
svg.i{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }

.app{ display:grid; grid-template-rows:auto auto auto auto minmax(0,1fr) auto auto; height:100%; }

/* barra de título */
.title{ height:30px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; background:var(--ch2); border-bottom:1px solid var(--bd); padding:0 10px; }
.logo{ justify-self:start; display:inline-flex; font:400 17px/1 var(--disp); letter-spacing:.4px; border:1px solid var(--bd); }
.logo b{ background:var(--yel); color:var(--ink); padding:4px 5px 2px; font-weight:400; }
.logo span{ background:#111; color:#fff; padding:4px 5px 2px; }
.title h1{ margin:0; font-size:13px; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw; }
.title h1 input{ background:transparent; border:1px solid transparent; font-weight:700; text-align:center; width:min(420px, 50vw); padding:2px 6px; border-radius:4px; }
.title h1 input:hover{ border-color:var(--bd2); } .title h1 input:focus{ background:var(--in); border-color:var(--ac); outline:none; }
.save{ justify-self:end; font-size:12px; color:var(--mu); display:flex; gap:6px; align-items:center; white-space:nowrap; }
.save i{ width:7px; height:7px; border-radius:50%; background:var(--mu); }
.save.ok i{ background:var(--ok); } .save.busy i{ background:var(--yel); }

/* menú */
.menubar{ display:flex; gap:2px; padding:0 6px; background:var(--ch2); border-bottom:1px solid var(--bd); height:26px; align-items:stretch; }
.mi{ position:relative; }
.mi > button{ height:100%; border:0; background:none; padding:0 9px; cursor:default; border-radius:4px; }
.mi > button:hover, .mi.open > button{ background:var(--ac); color:#fff; }
.drop{ position:absolute; left:0; top:100%; min-width:240px; background:var(--ch3); border:1px solid var(--bd); border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.45); padding:4px; display:none; z-index:60; }
.mi.open .drop{ display:block; }
.drop button{ display:flex; justify-content:space-between; gap:20px; width:100%; border:0; background:none; text-align:left; padding:5px 10px; border-radius:4px; cursor:default; }
.drop button:hover{ background:var(--ac); color:#fff; }
.drop button kbd{ font:inherit; color:var(--mu); } .drop button:hover kbd{ color:#dfe8ff; }
.drop button.on::before{ content:"✓"; position:absolute; margin-left:-9px; }
.drop hr{ border:0; border-top:1px solid var(--bd2); margin:4px 6px; }
.drop h4{ margin:6px 10px 2px; font-size:11px; color:var(--mu); font-weight:600; }

/* pestañas de herramientas y barra */
.tooltabs{ display:flex; gap:0; padding:0 8px; background:var(--ch); border-bottom:1px solid var(--bd); overflow-x:auto; scrollbar-width:none; }
.tooltabs button{ border:0; background:none; padding:5px 11px; color:var(--mu); cursor:default; white-space:nowrap; border-bottom:2px solid transparent; }
.tooltabs button[aria-selected="true"]{ color:var(--tx); background:var(--ch2); border-bottom-color:var(--ac2); }
.toolbar{ display:flex; align-items:center; gap:2px; padding:4px 8px; background:var(--ch2); border-bottom:1px solid var(--bd); overflow-x:auto; scrollbar-width:none; min-height:42px; }
.tb{ display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; background:none; padding:5px; border-radius:5px; cursor:default; white-space:nowrap; }
.tb:hover{ background:var(--ch3); border-color:var(--bd2); }
.tb:active{ background:var(--ac); color:#fff; }
.tb[aria-pressed="true"]{ background:var(--ac); color:#fff; border-color:var(--ac2); }
.tb:disabled{ opacity:.35; pointer-events:none; }
.tb canvas{ width:26px; height:26px; border-radius:3px; background:#fff; }
.tb.lbl{ padding:4px 9px 4px 5px; }
.sep{ width:1px; height:24px; background:var(--bd2); margin:0 5px; flex:none; }

/* área principal */
.main{ display:grid; grid-template-columns:212px minmax(0,1fr) 300px; min-height:0; }
.side{ background:var(--ch); min-height:0; overflow:auto; }
.side.l{ border-right:1px solid var(--bd); }
.side.r{ border-left:1px solid var(--bd); display:flex; flex-direction:column; overflow:hidden; }
.cmd{ padding:8px; position:relative; border-bottom:1px solid var(--bd); }
.cmd input{ width:100%; background:var(--in); border:1px solid var(--bd2); border-radius:4px; padding:5px 8px; }
.cmd input:focus{ border-color:var(--ac); outline:none; }
.sugg{ position:absolute; left:8px; right:8px; top:calc(100% - 4px); background:var(--ch3); border:1px solid var(--bd); border-radius:6px; box-shadow:0 10px 24px rgba(0,0,0,.45); z-index:50; padding:3px; display:none; max-height:300px; overflow:auto; }
.sugg.open{ display:block; }
.sugg button{ display:block; width:100%; text-align:left; border:0; background:none; padding:4px 8px; border-radius:4px; cursor:default; }
.sugg button small{ color:var(--mu); margin-left:6px; }
.sugg button[aria-selected="true"], .sugg button:hover{ background:var(--ac); color:#fff; }
.sugg button[aria-selected="true"] small, .sugg button:hover small{ color:#dfe8ff; }
.palette{ padding:8px; display:grid; grid-template-columns:repeat(5, 1fr); gap:2px; border-bottom:1px solid var(--bd); }
.palette .ph{ grid-column:1 / -1; font-size:11px; color:var(--mu); margin:6px 2px 2px; }
.palette .ph:first-child{ margin-top:0; }
.pal{ aspect-ratio:1; border:1px solid transparent; background:none; border-radius:5px; display:grid; place-items:center; cursor:default; padding:2px; }
.pal:hover{ background:var(--ch3); border-color:var(--bd2); }
.pal[aria-pressed="true"]{ background:var(--ac); border-color:var(--ac2); color:#fff; }
.pal canvas{ width:28px; height:28px; border-radius:3px; background:#fff; }
.panel-h{ display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:var(--ch2); border-bottom:1px solid var(--bd); font-size:12px; color:var(--mu); }
.osnap{ padding:6px 12px 10px; display:grid; gap:4px; }
.osnap label{ display:flex; gap:8px; align-items:center; cursor:default; }
.osnap input{ accent-color:var(--ac); width:14px; height:14px; margin:0; }

/* viewports */
.vpwrap{ display:grid; grid-template-rows:minmax(0,1fr) auto; min-width:0; min-height:0; background:var(--bd); }
.vps{ display:grid; gap:3px; padding:3px; min-height:0; min-width:0; grid-template-columns:1fr; grid-template-rows:1fr; }
.vps.four{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.vp{ position:relative; min-width:0; min-height:0; overflow:hidden; background:#fff; display:none; outline:1px solid var(--bd2); }
.vps.four .vp{ display:block; }
.vps:not(.four) .vp.cur{ display:block; }
.vp.active{ outline:2px solid var(--ac2); z-index:1; }
.vp .body{ position:absolute; inset:0; }
.vp canvas{ display:block; width:100%; height:100%; }
#plan{ touch-action:none; }
.vlabel{ position:absolute; left:4px; top:4px; z-index:5; display:inline-flex; border-radius:3px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.3); }
.vlabel button{ border:0; background:#5a5a5e; color:#fff; font-weight:700; padding:3px 8px; cursor:default; font-size:13px; }
.vlabel button + button{ padding:3px 6px; border-left:1px solid rgba(255,255,255,.25); }
.vp.active .vlabel button{ background:var(--ac); }
.vmenu{ position:absolute; left:4px; top:30px; z-index:40; background:var(--ch3); border:1px solid var(--bd); border-radius:6px; box-shadow:0 10px 30px rgba(0,0,0,.45); padding:4px; min-width:210px; display:none; color:var(--tx); }
.vmenu.open{ display:block; }
.vmenu button{ display:block; width:100%; text-align:left; border:0; background:none; padding:5px 10px 5px 24px; border-radius:4px; cursor:default; position:relative; }
.vmenu button.on::before{ content:"✓"; position:absolute; left:8px; }
.vmenu button:hover{ background:var(--ac); color:#fff; }
.vmenu hr{ border:0; border-top:1px solid var(--bd2); margin:4px 6px; }
.vps.four .vhint{ display:none; }
.vhint{ position:absolute; right:6px; bottom:6px; z-index:4; font-size:11px; color:#555; background:rgba(255,255,255,.8); padding:2px 6px; border-radius:3px; pointer-events:none; }
.nothree{ position:absolute; inset:0; display:grid; place-items:center; color:#555; text-align:center; padding:20px; }
.vtabs{ display:flex; align-items:center; gap:0; background:var(--ch); border-top:1px solid var(--bd); padding:0 6px; height:30px; }
.vtabs .tb{ padding:3px 5px; }
.vtabs .vt{ border:0; background:none; padding:0 14px; height:100%; color:var(--mu); cursor:default; position:relative; }
.vtabs .vt + .vt::before{ content:""; position:absolute; left:0; top:8px; bottom:8px; width:1px; background:var(--bd2); }
.vtabs .vt[aria-selected="true"]{ color:var(--ac2); font-weight:600; }

/* panel derecho */
.rtabs{ display:flex; background:var(--ch2); border-bottom:1px solid var(--bd); flex:none; }
.rtabs button{ flex:1; border:0; background:none; padding:7px 4px; color:var(--mu); cursor:default; display:flex; gap:5px; align-items:center; justify-content:center; border-bottom:2px solid transparent; }
.rtabs button svg{ width:16px; height:16px; }
.rtabs button[aria-selected="true"]{ color:var(--tx); border-bottom-color:var(--ac2); background:var(--ch); }
.rtabs .t-tools{ display:none; }
.rpanes{ overflow:auto; flex:1; min-height:0; }
.pane{ display:none; padding:10px 12px 20px; }
body[data-rtab="props"] #pProps, body[data-rtab="layers"] #pLayers, body[data-rtab="summary"] #pSummary, body[data-rtab="tools"] #pTools{ display:block; }
.ptitle{ font-weight:700; font-size:13px; margin:2px 0 8px; }
.sec{ margin:14px 0 6px; font-weight:600; font-size:12px; color:var(--tx); padding-bottom:4px; border-bottom:1px solid var(--bd2); }
.sec:first-child{ margin-top:2px; }
.prow{ display:grid; grid-template-columns:92px minmax(0,1fr); gap:8px; align-items:center; margin:5px 0; }
.prow > label, .prow > span.l{ text-align:right; color:var(--mu); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.prow input, .prow select{ width:100%; background:var(--in); border:1px solid var(--bd2); border-radius:4px; padding:3px 6px; min-width:0; }
.prow input:focus, .prow select:focus{ border-color:var(--ac); outline:none; }
.prow input:disabled{ opacity:.5; }
.prow .v{ font-variant-numeric:tabular-nums; }
.prow input[type=range]{ padding:0; border:0; background:none; accent-color:var(--ac); }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.catsel{ display:grid; grid-template-columns:16px 1fr; gap:6px; align-items:center; }
.catsel i{ width:16px; height:16px; border:1px solid var(--bd); border-radius:3px; }
.btns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
.btn{ border:1px solid var(--bd2); background:var(--ch3); padding:4px 10px; border-radius:5px; cursor:default; }
.btn:hover{ border-color:var(--ac2); }
.btn.pri{ background:var(--ac); border-color:var(--ac2); color:#fff; }
.btn.warn:hover{ background:var(--danger); border-color:var(--danger); color:#fff; }
.note{ color:var(--mu); font-size:12px; margin:8px 0 0; line-height:1.45; }
.chips{ display:flex; flex-wrap:wrap; gap:4px; }
.chip{ display:inline-flex; gap:5px; align-items:center; border:1px solid var(--bd2); background:var(--ch3); border-radius:4px; padding:2px 7px 2px 4px; cursor:default; font-size:12px; }
.chip i{ width:11px; height:11px; border-radius:2px; border:1px solid rgba(0,0,0,.4); }
.chip:hover{ border-color:var(--ac2); }
.upl{ display:block; border:1px dashed var(--bd2); padding:10px; border-radius:5px; text-align:center; cursor:default; color:var(--mu); }
.upl:hover{ border-color:var(--ac2); color:var(--tx); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* capas */
.layers{ width:100%; border-collapse:collapse; font-size:12.5px; }
.layers th{ text-align:left; font-weight:600; color:var(--mu); font-size:11px; padding:4px 4px; border-bottom:1px solid var(--bd2); }
.layers td{ padding:4px 4px; border-bottom:1px solid var(--bd); }
.layers tr:hover td{ background:var(--ch2); }
.layers tr.off td{ color:var(--mu); }
.bulb{ border:0; background:none; padding:0; cursor:default; display:grid; place-items:center; }
.bulb svg{ width:16px; height:16px; stroke-width:1.6; }
.bulb.on svg{ fill:var(--yel); stroke:#8a7c00; }
.bulb:not(.on) svg{ stroke:var(--mu); }
.sq{ width:13px; height:13px; border-radius:2px; border:1px solid rgba(0,0,0,.45); display:inline-block; vertical-align:middle; }
.layers .num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--mu); }
.linkb{ border:0; background:none; color:var(--ac2); cursor:default; padding:0; font-size:12px; }
.linkb:hover{ text-decoration:underline; }

/* resumen */
.kpis{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
.kpi{ background:var(--ch2); border:1px solid var(--bd); border-radius:6px; padding:8px 9px 7px; }
.kpi b{ display:block; font:400 30px/1 var(--disp); letter-spacing:.3px; }
.kpi span{ font-size:11.5px; color:var(--mu); }
.kpi.hero{ background:var(--yel); color:var(--ink); border-color:#c9b900; } .kpi.hero span{ color:#4a4600; }
.bars{ display:grid; gap:6px; }
.bar{ display:grid; grid-template-columns:1fr auto; font-size:12px; gap:2px 8px; }
.bar em{ font-style:normal; color:var(--mu); font-variant-numeric:tabular-nums; }
.bar .tr{ grid-column:1 / -1; height:6px; background:var(--in); border-radius:3px; overflow:hidden; }
.bar .fl{ height:100%; border-radius:3px; }
.list{ list-style:none; margin:0; padding:0; }
.list li{ display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--bd); font-size:12.5px; }
.warn{ display:block; width:100%; text-align:left; background:rgba(229,83,75,.1); border:1px solid rgba(229,83,75,.55); color:var(--tx); border-radius:5px; padding:6px 8px; margin-bottom:5px; cursor:default; font-size:12px; }
.warn b{ color:var(--danger); }
.warn:hover{ border-color:var(--danger); }
.good{ border:1px solid rgba(63,185,80,.6); background:rgba(63,185,80,.1); border-radius:5px; padding:6px 8px; font-size:12px; }

/* historial y barra de estado */
.hist{ display:flex; align-items:center; gap:8px; padding:0 10px; height:24px; background:var(--ch); border-top:1px solid var(--bd); font-size:12px; color:var(--tx); white-space:nowrap; overflow:hidden; }
.hist::before{ content:""; width:4px; height:4px; border-radius:50%; background:var(--mu); flex:none; }
.status{ display:flex; align-items:center; gap:4px; padding:3px 8px; background:var(--ch2); border-top:1px solid var(--bd); font-size:12px; white-space:nowrap; overflow-x:auto; scrollbar-width:none; }
.status .f{ color:var(--mu); padding:0 8px; font-variant-numeric:tabular-nums; }
.status .f b{ color:var(--tx); font-weight:500; margin-left:4px; display:inline-block; min-width:62px; }
.status .grow{ flex:1; }
.tg{ border:1px solid transparent; background:none; padding:3px 9px; border-radius:4px; cursor:default; color:var(--mu); font-weight:600; }
.tg[aria-pressed="true"]{ background:var(--in); color:var(--tx); border-color:var(--bd2); }
.tg:hover{ border-color:var(--bd2); }

/* diálogos */
dialog{ background:var(--ch); color:var(--tx); border:1px solid var(--bd); border-radius:10px; padding:0; box-shadow:0 20px 60px rgba(0,0,0,.55); width:min(780px, calc(100vw - 24px)); max-height:calc(100vh - 40px); }
dialog::backdrop{ background:rgba(0,0,0,.45); }
.dh{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:var(--ch2); border-bottom:1px solid var(--bd); }
.dh h2{ margin:0; font-size:14px; }
.dg{ display:grid; grid-template-columns:1.25fr 1fr; }
.dg > section{ padding:14px; overflow:auto; max-height:calc(100vh - 120px); }
.dg > section + section{ border-left:1px solid var(--bd); background:var(--ch2); }
.plist{ display:grid; gap:6px; }
.pc{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:8px 10px; border:1px solid var(--bd2); border-radius:6px; background:var(--ch2); }
.pc.cur{ border-color:var(--ac2); }
.pc b{ display:block; } .pc small{ color:var(--mu); font-size:12px; }
.pc .a{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
.tag{ display:inline-block; font-size:10.5px; font-weight:700; padding:0 5px; border-radius:3px; background:var(--ch3); border:1px solid var(--bd2); margin-right:6px; }
.tag.vm{ background:var(--yel); color:var(--ink); border-color:#c9b900; }
.empty{ color:var(--mu); border:1px dashed var(--bd2); border-radius:6px; padding:16px; text-align:center; }
.fld{ display:grid; gap:4px; margin-bottom:10px; }
.fld label, .fld .l{ font-size:12px; color:var(--mu); }
.fld input, .fld select{ background:var(--in); border:1px solid var(--bd2); border-radius:4px; padding:5px 8px; width:100%; }
.radio{ display:grid; gap:6px; margin-bottom:10px; }
.radio label{ display:flex; gap:8px; align-items:flex-start; border:1px solid var(--bd2); padding:7px 8px; border-radius:6px; cursor:default; background:var(--ch); }
.radio label:has(input:checked){ border-color:var(--ac2); }
.radio input{ accent-color:var(--ac); margin-top:2px; }
.radio small{ display:block; color:var(--mu); font-size:12px; }
.help{ padding:14px 16px; overflow:auto; max-height:calc(100vh - 110px); columns:2; column-gap:28px; }
.help h3{ font-size:12px; color:var(--mu); margin:0 0 6px; break-after:avoid; }
.help dl{ margin:0 0 14px; display:grid; grid-template-columns:auto 1fr; gap:3px 12px; break-inside:avoid; }
.help dt{ font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--ac2); }
.help dd{ margin:0; font-size:12.5px; }

.toast{ position:fixed; left:50%; bottom:calc(70px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(10px); background:var(--ch3); color:var(--tx); border:1px solid var(--bd2); border-radius:6px; padding:7px 12px; box-shadow:0 8px 24px rgba(0,0,0,.4); opacity:0; transition:.18s; z-index:100; pointer-events:none; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width: 900px){
  .menubar, .tooltabs, .side.l, .hide-m{ display:none !important; }
  .main{ grid-template-columns:1fr; grid-template-rows:minmax(0,1.3fr) minmax(0,1fr); }
  .side.r{ border-left:0; border-top:1px solid var(--bd); }
  .rtabs .t-tools{ display:flex; }
  .title{ grid-template-columns:auto 1fr auto; gap:8px; }
  .title h1 input{ width:100%; }
  .vps.four{ grid-template-columns:1fr; grid-template-rows:1fr; }
  .vps.four .vp{ display:none; } .vps.four .vp.cur{ display:block; }
  .vhint{ display:none; }
  .dg{ grid-template-columns:1fr; } .dg > section + section{ border-left:0; border-top:1px solid var(--bd); }
  .help{ columns:1; }
  .status .f.c{ display:none; }
}
#pTools .palette{ grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); border:0; padding:0; }
@media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body data-rtab="props">
<div class="app">
  <header class="title">

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => Number(n).toLocaleString('es-CO', { maximumFractionDigits: d, minimumFractionDigits: d });
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
const INK = '#272622', YEL = '#F5E100';
const UIFONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif';
const VC = { bg:'#FFFFFF', floor:'#FFFFFF', minor:'rgba(0,0,0,.07)', major:'rgba(0,0,0,.14)', wall:'#272622', text:'#272622', muted:'#6B6B70', axisX:'#C43B3B', axisY:'#2E9A45', danger:'#D93B30', sel:'#F5E100' };

/* ---------- categorías y catálogo ---------- */
const CATS = [
  { id:'sin',  name:'Sin asignar',          color:'#D9D6CC' },
  { id:'nov',  name:'Novedades',            color:'#F5E100' },
  { id:'mas',  name:'Más vendidos',         color:'#FF8A3D' },
  { id:'rec',  name:'Bukz recomienda',      color:'#3A3834' },
  { id:'fic',  name:'Ficción',              color:'#6C8CFF' },
  { id:'nof',  name:'No ficción',           color:'#3FB68B' },
  { id:'arte', name:'Arte y diseño',        color:'#27C3D6' },
  { id:'com',  name:'Cómic y novela gráfica', color:'#E0483E' },
  { id:'juv',  name:'Juvenil',              color:'#B98CFF' },
  { id:'inf',  name:'Infantil',             color:'#FF7AB6' },
  { id:'pap',  name:'Papelería y regalos',  color:'#B08D5E' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const CATALOG = [
  { type:'est_mural', group:'Estanterías', name:'Estantería mural', short:'Estantería', w:120, d:35, h:220, draw:'shelf', levels:6, faces:1, resize:true, vm:true, cmd:['estanteria','mural'] },
  { type:'est_doble', group:'Estanterías', name:'Góndola doble cara', short:'Góndola', w:120, d:60, h:150, draw:'gondola', levels:4, faces:2, resize:true, vm:true, cmd:['gondola'] },
  { type:'est_baja',  group:'Estanterías', name:'Estantería baja', short:'Baja', w:120, d:35, h:100, draw:'shelf', levels:3, faces:1, resize:true, vm:true, cmd:['baja','estanteriabaja'] },
  { type:'torre',     group:'Estanterías', name:'Torre giratoria', short:'', w:50, d:50, h:170, draw:'tower', cap:80, vm:true, cmd:['torre','giratoria'] },
  { type:'mesa_nov',  group:'Exhibición', name:'Mesa de novedades', short:'Mesa', w:120, d:80, h:75, draw:'table', resize:true, vm:true, cmd:['mesa','mesanovedades'] },
  { type:'mesa_isla', group:'Exhibición', name:'Mesa isla baja', short:'Isla', w:160, d:100, h:55, draw:'table', resize:true, vm:true, cmd:['isla','mesaisla'] },
  { type:'mesa_esc',  group:'Exhibición', name:'Mesa escalonada', short:'Escalonada', w:140, d:70, h:90, draw:'tiered', resize:true, vm:true, cmd:['escalonada'] },
  { type:'bins',      group:'Exhibición', name:'Cajones de álbumes', short:'Cajones', w:80, d:80, h:60, draw:'bins', cap:60, vm:true, cmd:['cajones','albumes'] },
  { type:'vitrina',   group:'Exhibición', name:'Vitrina de fachada', short:'Vitrina', w:150, d:50, h:110, draw:'vitrina', resize:true, vm:true, cmd:['vitrina'] },
  { type:'hablador',  group:'Exhibición', name:'Hablador de pie', short:'', w:45, d:8, h:170, draw:'sign', vm:true, nocap:true, cmd:['hablador','senal'] },
  { type:'caja',      group:'Servicio', name:'Caja', short:'Caja', w:180, d:60, h:100, draw:'counter', resize:true, cmd:['caja','mostrador'] },
  { type:'barra',     group:'Servicio', name:'Barra de café', short:'Café', w:240, d:70, h:105, draw:'counter', resize:true, cmd:['barra','cafe'] },
  { type:'bodega',    group:'Servicio', name:'Bodega', short:'Bodega', w:250, d:200, h:240, draw:'zone', resize:true, cmd:['bodega','deposito'] },
  { type:'sillon',    group:'Lectura y eventos', name:'Sillón de lectura', short:'', w:85, d:85, h:85, draw:'armchair', cmd:['sillon'] },
  { type:'silla',     group:'Lectura y eventos', name:'Silla', short:'', w:45, d:45, h:85, draw:'chair', cmd:['silla'] },
  { type:'mesa_cafe', group:'Lectura y eventos', name:'Mesa de café', short:'', w:70, d:70, h:75, draw:'round', cmd:['mesacafe','mesaredonda'] },
  { type:'puff',      group:'Lectura y eventos', name:'Puff infantil', short:'', w:45, d:45, h:35, draw:'puff', cmd:['puff'] },
  { type:'tarima',    group:'Lectura y eventos', name:'Tarima de eventos', short:'Tarima', w:300, d:200, h:20, draw:'stage', resize:true, cmd:['tarima','escenario'] },
  { type:'tapete',    group:'Lectura y eventos', name:'Tapete zona infantil', short:'Zona infantil', w:200, d:150, h:1, draw:'rug', resize:true, cmd:['tapete','zonainfantil'] },
  { type:'planta',    group:'Lectura y eventos', name:'Planta', short:'', w:50, d:50, h:140, draw:'plant', cmd:['planta'] },
  { type:'acceso',    group:'Arquitectura', name:'Acceso principal', short:'Acceso', w:180, d:12, h:240, draw:'entrance', resize:true, arch:true, onwall:true, cmd:['acceso','entrada'] },
  { type:'puerta',    group:'Arquitectura', name:'Puerta', short:'', w:90, d:12, h:210, draw:'door', resize:true, arch:true, onwall:true, cmd:['puerta'] },
  { type:'ventana',   group:'Arquitectura', name:'Ventanal', short:'', w:200, d:12, h:170, draw:'window', resize:true, arch:true, onwall:true, cmd:['ventana','ventanal'] },
  { type:'muro',      group:'Arquitectura', name:'Muro interior', short:'', w:200, d:12, h:0, draw:'wall', resize:true, arch:true, cmd:['muro','pared'] },
  { type:'columna',   group:'Arquitectura', name:'Columna', short:'', w:40, d:40, h:0, draw:'column', resize:true, arch:true, cmd:['columna'] },
];
const DEF = Object.fromEntries(CATALOG.map(d => [d.type, d]));
const GROUPS = [...new Set(CATALOG.map(c => c.group))];
const LOW = new Set(['tapete', 'bodega', 'tarima']);
const NO_AISLE = new Set(['silla','sillon','puff','mesa_cafe','planta','hablador','tapete','bodega','puerta','acceso','ventana']);
const layerOf = it => LOW.has(it.type) ? 0 : DEF[it.type].arch ? 2 : 1;
const AISLE = 90;
const LAYERS = [{ key:'arq', name:'Arquitectura', color:'#272622' }, ...CATS.map(c => ({ key:c.id, name:c.name, color:c.color })), { key:'otros', name:'Servicio y lectura', color:'#B7B2A6' }];
const layerKey = it => DEF[it.type].arch ? 'arq' : DEF[it.type].vm ? (it.cat || 'sin') : 'otros';

function capacity(it) {
  const d = DEF[it.type]; if (d.nocap) return 0;
  const lv = it.levels || d.levels;
  switch (d.draw) {
    case 'shelf': case 'gondola': return Math.round(lv * d.faces * (it.w / 100) * 30);
    case 'table': return Math.round((it.w * it.d) / (17 * 23)) * 5;
    case 'tiered': return Math.round((it.w / 100) * 3 * 7) * 4;
    case 'vitrina': return Math.round((it.w / 100) * 12);
    default: return d.cap || 0;
  }
}
const shelfFront = it => { const d = DEF[it.type]; return d.levels ? (it.w / 100) * d.faces : 0; };
const shelfRun = it => { const d = DEF[it.type]; return d.levels ? (it.w / 100) * d.faces * (it.levels || d.levels) : 0; };
function mkItem(type, x, y, extra = {}) {
  const d = DEF[type];
  const it = { id: uid(), type, x, y, rot: 0, w: d.w, d: d.d, h: d.h, cat: 'sin', label: '' };
  if (d.levels) it.levels = d.levels;
  return Object.assign(it, extra);
}

/* ---------- plantillas ---------- */
function sampleItems(W, D) {
  const I = []; const add = (t, x, y, e) => I.push(mkItem(t, x, y, e));
  add('acceso', W / 2, D, { rot: 180 });
  if (W < 900 || D < 650) return I;
  const topCats = ['fic','fic','fic','nof','nof','nof','arte','arte','com','com'];
  const n = Math.floor(W / 120);
  for (let i = 0; i < n; i++) add('est_mural', 60 + i * 120 + (W - n * 120) / 2, 17.5, { cat: topCats[i % topCats.length] });
  [0, 1].forEach(i => add('est_mural', 17.5, 95 + i * 120, { rot: 270, cat: 'juv' }));
  [0, 1].forEach(i => add('est_baja', 17.5, 335 + i * 120, { rot: 270, cat: 'inf' }));
  add('tapete', 160, 420, { w: 200, d: 150 });
  add('puff', 130, 390); add('puff', 195, 450); add('bins', 200, 330, { cat: 'inf' });
  ['rec','rec','pap'].forEach((c, i) => add('est_mural', W - 17.5, 95 + i * 120, { rot: 90, cat: c }));
  add('caja', W - 30, D * 0.75, { rot: 90 });
  add('est_doble', W / 2 - 120, 280, { cat: 'fic' });
  add('est_doble', W / 2 + 120, 280, { cat: 'nof' });
  add('mesa_esc', W / 2, 440, { cat: 'mas' });
  add('mesa_nov', W / 2 - 60, 610, { cat: 'nov' });
  add('mesa_nov', W / 2 + 60, 610, { cat: 'nov' });
  add('torre', W / 2 + 260, 560, { cat: 'com' });
  add('hablador', W / 2 + 160, D - 80, { cat: 'nov' });
  add('ventana', W * 0.2, D, { rot: 180, w: 300 });
  add('ventana', W * 0.8, D, { rot: 180, w: 300 });
  add('vitrina', W * 0.2, D - 25, { cat: 'nov' });
  add('vitrina', W * 0.8, D - 25, { cat: 'mas' });
  add('sillon', W / 2 + 300, 240); add('sillon', W / 2 + 420, 240);
  add('mesa_cafe', W / 2 + 360, 330);
  add('columna', 300, 520);
  add('planta', 60, D - 60); add('planta', W - 60, D - 60);
  return I;
}
function newProject(name, kind, W, D, tpl) {
  return { id: uid(), name, kind, room: { w: W, d: D, h: 300 }, items: tpl === 'tipo' ? sampleItems(W, D) : sampleItems(W, D).slice(0, 1), underlay: null, hidden: [], updatedAt: 0 };
}

/* ---------- estado ---------- */
let P = newProject('Tienda tipo 12 × 8 m', 'apertura', 1200, 800, 'tipo');
let scratch = true;
let sel = new Set();
let display = 'sombreado';       // sombreado | categorias | tecnico
let layout = 1, curView = 'superior', activeView = 'superior';
let tool = 'select';
const SN = { walls: true, items: true, grid: true, check: true, labels: true, ortho: false };
const V = { s: 0.6, ox: 40, oy: 40 };
let undoStack = [], redoStack = [];
const underlayImg = { src: null, img: null };
let hidden = new Set();
const mode2d = () => display === 'categorias' ? 'cat' : display === 'tecnico' ? 'tec' : 'mueble';
const findItem = id => P.items.find(i => i.id === id);
const selItems = () => P.items.filter(i => sel.has(i.id));
const isVisible = it => !hidden.has(layerKey(it));
const visibleItems = () => P.items.filter(isVisible);

/* ---------- geometría ---------- */
const rad = it => it.rot * Math.PI / 180;
function corners(it) {
  const r = rad(it), c = Math.cos(r), s = Math.sin(r), hw = it.w / 2, hd = it.d / 2;
  return [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x, y]) => [it.x + x * c - y * s, it.y + x * s + y * c]);
}
function aabb(it) { const cs = corners(it), xs = cs.map(p => p[0]), ys = cs.map(p => p[1]); return { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) }; }
function groupBox(items) { const bs = items.map(aabb); return { x0: Math.min(...bs.map(b => b.x0)), x1: Math.max(...bs.map(b => b.x1)), y0: Math.min(...bs.map(b => b.y0)), y1: Math.max(...bs.map(b => b.y1)) }; }
function toLocal(it, x, y) { const r = rad(it), c = Math.cos(r), s = Math.sin(r), dx = x - it.x, dy = y - it.y; return [dx * c + dy * s, -dx * s + dy * c]; }
function localToWorld(it, lx, ly) { const r = rad(it), c = Math.cos(r), s = Math.sin(r); return [it.x + lx * c - ly * s, it.y + lx * s + ly * c]; }
function hitItem(it, x, y, pad = 0) { const [lx, ly] = toLocal(it, x, y); return Math.abs(lx) <= it.w / 2 + pad && Math.abs(ly) <= it.d / 2 + pad; }
function satOverlap(a, b) {
  const A = corners(a), B = corners(b);
  for (const poly of [A, B]) for (let i = 0; i < 4; i++) {
    const p = poly[i], q = poly[(i + 1) % 4], nx = q[1] - p[1], ny = p[0] - q[0];
    let amin = Infinity, amax = -Infinity, bmin = Infinity, bmax = -Infinity;
    for (const v of A) { const d = v[0] * nx + v[1] * ny; amin = Math.min(amin, d); amax = Math.max(amax, d); }
    for (const v of B) { const d = v[0] * nx + v[1] * ny; bmin = Math.min(bmin, d); bmax = Math.max(bmax, d); }
    if ((Math.min(amax, bmax) - Math.max(amin, bmin)) / (Math.hypot(nx, ny) || 1) < 2) return false;
  }
  return true;
}
const toWorld = (px, py) => [(px - V.ox) / V.s, (py - V.oy) / V.s];
const toScreen = (x, y) => [x * V.s + V.ox, y * V.s + V.oy];

/* ---------- revisión ---------- */
function analyze() {
  const W = P.room.w, D = P.room.d;
  const overlaps = new Set(), pairs = [], aisles = [], outside = [];
  const solid = P.items.filter(i => !LOW.has(i.type) && !DEF[i.type].onwall);
  for (let i = 0; i < solid.length; i++) for (let j = i + 1; j < solid.length; j++) {
    const a = solid[i], b = solid[j];
    if (DEF[a.type].arch && DEF[b.type].arch) continue;
    if (satOverlap(a, b)) { overlaps.add(a.id); overlaps.add(b.id); pairs.push([a, b]); }
  }
  const boxes = P.items.filter(i => !NO_AISLE.has(i.type)).map(i => ({ it: i, ...aabb(i) }));
  for (const b of boxes) if ((b.x0 < -3 || b.y0 < -3 || b.x1 > W + 3 || b.y1 > D + 3) && !DEF[b.it.type].onwall) outside.push(b.it);
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];

  const pad = 60, head = 120, legendH = mode === 'cat' ? 70 : 0;
  const cw = Math.round(W * s + pad * 2), ch = Math.round(D * s + pad * 2 + head + legendH + 30);
  const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, cw, ch); g.fillStyle = YEL; g.fillRect(0, 0, cw, 12);
  g.fillStyle = INK; g.font = '400 56px "Bebas Neue", Impact, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillText(P.name, pad, 78);
  const S = computeSummary();
  g.font = `500 18px ${UIFONT}`; g.fillStyle = '#6B6962';
  g.fillText(`${P.kind === 'vm' ? 'Visual merchandising' : 'Apertura de tienda'}  ·  ${fmt(W / 100, 1)} × ${fmt(D / 100, 1)} m (${fmt(S.area, 1)} m²)  ·  ${fmt(S.front, 1)} m de estantería  ·  ${fmt(S.cap)} libros aprox.  ·  ${new Date().toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })}`, pad, 106);
  g.save(); g.translate(pad, head + pad / 2);
  drawRoom(g, s, false);
  g.save(); g.beginPath(); g.rect(0, 0, W * s, D * s); g.clip(); drawGrid(g, 0, 0, W, D, s);
  if (underlayImg.img && P.underlay) { const u = P.underlay; g.globalAlpha = (u.opacity ?? .5) * .6; g.drawImage(underlayImg.img, u.x * s, u.y * s, underlayImg.img.naturalWidth * u.scale * s, underlayImg.img.naturalHeight * u.scale * s); g.globalAlpha = 1; }
  g.restore();
  const items = sortedItems(visibleItems());
  items.filter(i => layerOf(i) < 2).forEach(it => drawItem(g, it, s, mode)); drawRoom(g, s, true); items.filter(i => layerOf(i) === 2).forEach(it => drawItem(g, it, s, mode));
  const y0 = D * s + 36; g.strokeStyle = INK; g.lineWidth = 2;
  for (let k = 0; k < 4; k++) { g.fillStyle = k % 2 ? '#fff' : INK; g.fillRect(k * 100 * s, y0, 100 * s, 8); g.strokeRect(k * 100 * s, y0, 100 * s, 8); }
  g.fillStyle = INK; g.font = `600 14px ${UIFONT}`; g.textAlign = 'center'; [0, 1, 2, 3, 4].forEach(k => g.fillText(`${k} m`, k * 100 * s, y0 + 26));
  g.restore();
  if (legendH) {
    const used = CATS.filter(cc => P.items.some(i => DEF[i.type].vm && i.cat === cc.id && isVisible(i))); let x = pad, y = ch - legendH + 10;
    g.font = `600 16px ${UIFONT}`; g.textAlign = 'left'; g.textBaseline = 'middle';
    used.forEach(cc => { const tw = g.measureText(cc.name).width; if (x + tw + 40 > cw - pad) { x = pad; y += 28; } g.fillStyle = cc.color; g.fillRect(x, y - 8, 16, 16); g.strokeStyle = INK; g.lineWidth = 2; g.strokeRect(x, y - 8, 16, 16); g.fillStyle = INK; g.fillText(cc.name, x + 24, y); x += tw + 48; });
  }

}
function export3D() {

function exportCSV() {

  rows.push([]); rows.push(['Metros de estantería (frente)', S.front.toFixed(1).replace('.', ',')]); rows.push(['Capacidad aproximada (libros)', S.cap]); rows.push(['Área del local (m²)', S.area.toFixed(1).replace('.', ',')]);
  download(`${slug(P.name)}-mobiliario.csv`, '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n'));
